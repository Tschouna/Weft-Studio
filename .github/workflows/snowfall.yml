# Snowfall, the desktop snow app in snowfall/:
# - renders the engine preview on Linux (a pretend desktop; also times the engine)
# - builds Snowfall.exe (one file, no installer) on Windows with Visual Studio's compiler, then runs it next
#   to a few app windows and reports memory, frame times and what it saw, plus a screenshot
# The exe is attached to each run as the "Snowfall" artifact.
name: Snowfall

on:
  push:
    paths: ['snowfall/**', '.github/workflows/snowfall.yml']
  workflow_dispatch:

concurrency:
  group: snowfall-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Engine preview
        working-directory: snowfall
        run: |
          mkdir -p preview
          g++ -O2 -std=c++17 -Isrc src/engine.cpp src/sprites.cpp tools/preview.cpp -o preview-bin
          ./preview-bin preview/
      - uses: actions/upload-artifact@v4
        with:
          name: Snowfall-preview
          path: snowfall/preview/*
          retention-days: 7

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build Snowfall.exe
        working-directory: snowfall
        shell: cmd
        run: call build-msvc.cmd
      - uses: actions/upload-artifact@v4
        with:
          name: Snowfall
          path: snowfall/dist/Snowfall.exe
          retention-days: 30
      - name: Open some windows, run Snowfall, shake a window, take screenshots
        working-directory: snowfall/dist
        shell: powershell
        run: |
          "exe size: $((Get-Item .\Snowfall.exe).Length) bytes"
          Add-Type -AssemblyName System.Drawing, System.Windows.Forms
          Add-Type -ReferencedAssemblies System.Drawing @"
          using System; using System.Drawing; using System.Runtime.InteropServices;
          public static class W {
            [DllImport("user32.dll")] public static extern bool MoveWindow(IntPtr h, int x, int y, int w, int hh, bool r);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] static extern IntPtr GetDC(IntPtr h);
            [DllImport("user32.dll")] static extern int ReleaseDC(IntPtr h, IntPtr dc);
            [DllImport("gdi32.dll")] static extern IntPtr CreateCompatibleDC(IntPtr dc);
            [DllImport("gdi32.dll")] static extern IntPtr CreateCompatibleBitmap(IntPtr dc, int w, int h);
            [DllImport("gdi32.dll")] static extern IntPtr SelectObject(IntPtr dc, IntPtr o);
            [DllImport("gdi32.dll")] static extern bool BitBlt(IntPtr d, int x, int y, int w, int h, IntPtr s, int sx, int sy, int rop);
            [DllImport("gdi32.dll")] static extern bool DeleteObject(IntPtr o);
            [DllImport("gdi32.dll")] static extern bool DeleteDC(IntPtr dc);
            // a screenshot that includes layered (see-through) windows: SRCCOPY | CAPTUREBLT
            public static void Shot(int w, int h, string path) {
              IntPtr screen = GetDC(IntPtr.Zero), dc = CreateCompatibleDC(screen), bmp = CreateCompatibleBitmap(screen, w, h);
              IntPtr old = SelectObject(dc, bmp);
              BitBlt(dc, 0, 0, w, h, screen, 0, 0, 0x00CC0020 | 0x40000000);
              SelectObject(dc, old);
              using (Bitmap b = Image.FromHbitmap(bmp)) b.Save(path, System.Drawing.Imaging.ImageFormat.Png);
              DeleteObject(bmp); DeleteDC(dc); ReleaseDC(IntPtr.Zero, screen);
            }
          }
          "@
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          "screen: $($b.Width)x$($b.Height)"
          $pos = @(@(60, 140, 520, 380), @(380, 260, 560, 360), @(620, 90, 360, 300))
          $procs = @()
          foreach ($p in $pos) {
            $n = Start-Process notepad -PassThru
            $procs += $n
            for ($i = 0; $i -lt 40 -and $n.MainWindowHandle -eq 0; $i++) { Start-Sleep -Milliseconds 250; $n.Refresh() }
            [W]::MoveWindow($n.MainWindowHandle, $p[0], $p[1], $p[2], $p[3], $true) | Out-Null
          }
          [W]::SetForegroundWindow($procs[1].MainWindowHandle) | Out-Null
          $snow = Start-Process .\Snowfall.exe -ArgumentList '--selftest', '50', "$PWD\selftest.txt" -PassThru
          Start-Sleep -Seconds 30
          $mem = Get-Process -Id $snow.Id | Select-Object WorkingSet64, PrivateMemorySize64, CPU
          "after 30 s: working set $([math]::Round($mem.WorkingSet64/1MB,1)) MB, private $([math]::Round($mem.PrivateMemorySize64/1MB,1)) MB, CPU time $([math]::Round($mem.CPU,2)) s"
          [W]::Shot($b.Width, $b.Height, "$PWD\screenshot.png")
          # shake the right-hand window back and forth
          $h = $procs[2].MainWindowHandle
          for ($k = 0; $k -lt 24; $k++) { $x = 620 + [int](70 * [math]::Sin($k * 1.3)); [W]::MoveWindow($h, $x, 90, 360, 300, $true) | Out-Null; Start-Sleep -Milliseconds 30 }
          [W]::MoveWindow($h, 620, 90, 360, 300, $true) | Out-Null
          Start-Sleep -Milliseconds 250
          [W]::Shot($b.Width, $b.Height, "$PWD\screenshot-shake.png")
          Start-Sleep -Seconds 11  # Snowfall opens its decorating toolbar for a while
          [W]::Shot($b.Width, $b.Height, "$PWD\screenshot-decorate.png")
          $snow.WaitForExit(30000) | Out-Null
          "exit code: $($snow.ExitCode)"
          Get-Content selftest.txt
          foreach ($n in $procs) { Stop-Process -Id $n.Id -ErrorAction SilentlyContinue }
          if (-not (Test-Path selftest.txt)) { throw "Snowfall did not finish its self-test" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Snowfall-on-Windows
          path: |
            snowfall/dist/screenshot*.png
            snowfall/dist/selftest.txt
          retention-days: 7
