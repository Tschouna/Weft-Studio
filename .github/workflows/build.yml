# Builds the Windows installer on every push. When package.json carries a version that has no release
# yet, the build is published as GitHub release v<version>, which installed copies of Weft Studio pick up
# as an automatic update. To release: bump "version" in package.json and push to main.
name: Build

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
      - run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run vendor
      - name: Is this a new version?
        id: ver
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" = "refs/heads/main" ] && ! git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "release=yes" >> "$GITHUB_OUTPUT"
          else
            echo "release=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Build installer
        run: npx electron-builder --win --publish never
      # One step creates the release with all its files, so nothing races to create it twice.
      # latest.yml is what installed copies read to find the update.
      - name: Publish release v${{ steps.ver.outputs.version }}
        if: steps.ver.outputs.release == 'yes'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.ver.outputs.version }}"
          awk -v v="$v" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > notes.md
          gh release create "v$v" dist/*.exe dist/*.exe.blockmap dist/latest.yml --target "$GITHUB_SHA" --title "Weft Studio $v" --notes-file notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: Weft-Studio-Setup
          path: dist/*.exe
          retention-days: 14
