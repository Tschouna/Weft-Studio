# Builds the Windows installer on every push. A version tag (v1.2.3) also publishes it as a GitHub
# release, which installed copies of Weft Studio pick up as an automatic update.
name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
      - run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run vendor
      - name: Build installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --win --publish never
      - name: Build installer and publish release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: Weft-Studio-Setup
          path: dist/*.exe
          retention-days: 14
