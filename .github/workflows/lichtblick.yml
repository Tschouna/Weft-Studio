# Lichtblick, the photo-weather phone app in lichtblick/:
# - on pushes that touch it: run its checks, and on main publish it to GitHub Pages
#   (one-time setup: Settings → Pages → Source: "GitHub Actions")
# - every three hours in the daytime: send new photo chances to your phone, if the repository has a
#   secret LICHTBLICK_PUSH (the setup code from the app: Settings → Alerts) or NTFY_TOPIC (ntfy.sh).
#   "Run workflow" with "test" ticked sends a test alert.
name: Lichtblick

on:
  push:
    paths: ['lichtblick/**', '.github/workflows/lichtblick.yml']
  schedule:
    - cron: '35 4-19/3 * * *'   # 04:35 to 19:35 UTC, every three hours: daytime in Switzerland
  workflow_dispatch:
    inputs:
      test:
        description: Send a test alert to the phone instead of checking the forecast
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule' && !inputs.test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node lichtblick/test/run.mjs

  pages:
    if: github.event_name != 'schedule' && !inputs.test && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the service worker with this build
        run: sed -i "s/__BUILD__/${GITHUB_SHA::8}/" lichtblick/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: lichtblick }
      - id: deploy
        uses: actions/deploy-pages@v4

  digest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      LICHTBLICK_PUSH: ${{ secrets.LICHTBLICK_PUSH }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      HAS_TARGET: ${{ secrets.LICHTBLICK_PUSH != '' || secrets.NTFY_TOPIC != '' }}
      LICHTBLICK_URL: ${{ vars.LICHTBLICK_URL }}
      LICHTBLICK_MIN: ${{ vars.LICHTBLICK_MIN }}
      LICHTBLICK_TEST: ${{ inputs.test }}
      LICHTBLICK_STATE: ${{ github.workspace }}/.lichtblick-sent.json
    steps:
      - name: Nothing to do without a phone to send to
        if: env.HAS_TARGET != 'true'
        run: echo "Add the secret LICHTBLICK_PUSH (the setup code from the app, Settings → Alerts) to receive alerts."
      - uses: actions/checkout@v4
        if: env.HAS_TARGET == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_TARGET == 'true'
        with: { node-version: 22 }
      # what was already sent, so the same chance is not sent every three hours
      - uses: actions/cache/restore@v4
        if: env.HAS_TARGET == 'true'
        with:
          path: .lichtblick-sent.json
          key: lichtblick-sent-${{ github.run_id }}
          restore-keys: lichtblick-sent-
      - name: Send the new photo chances
        if: env.HAS_TARGET == 'true'
        run: node lichtblick/scripts/digest.mjs
      - uses: actions/cache/save@v4
        if: env.HAS_TARGET == 'true' && hashFiles('.lichtblick-sent.json') != ''
        with:
          path: .lichtblick-sent.json
          key: lichtblick-sent-${{ github.run_id }}
